server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the gateway if needed, 
    # but usually the gateway handles this. 
    # Since the gateway is the main entry point, the frontend 
    # will just make requests to /api/... which the gateway 
    # (the same one serving the frontend) will catch.
}
