user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10000;
    use epoll;  # For high-concurrency (Linux)
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    # ============================================
    # Upstream Backend Services
    # ============================================
    upstream auth_service {
        server auth-service:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream user_service {
        server user-service:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream course_service {
        server course-service:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream order_service {
        server order-service:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream learning_service {
        server learning-service:3006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================
    # Main API Gateway
    # ============================================
    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for gateway itself
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","time":"$time_iso8601"}';
        }

        # ============================================
        # Auth Service Routes
        # ============================================
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;

            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================
        # User Service Routes
        # ============================================
        location /api/users/ {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================
        # Course Service Routes
        # ============================================
        location /api/courses/ {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://course_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================
        # Order Service Routes
        # ============================================
        location /api/orders/ {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://order_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================
        # Payment Service Routes
        # ============================================
        location /api/payments/ {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://payment_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================
        # Learning Service Routes
        # ============================================
        location /api/learning/ {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://learning_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Default 404
        location / {
            return 404 '{"error":"Not Found"}';
            add_header Content-Type application/json;
        }

        # Error pages
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            return 503 '{"error":"Service Temporarily Unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
