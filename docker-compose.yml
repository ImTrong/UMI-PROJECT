
services:
  # ============================================
  # MongoDB - Container Database dùng chung
  # Mỗi service kết nối đến database logic riêng
  # ============================================
  mongodb:
    image: mongo:7.0-jammy # Đã thay đổi từ mongo:7.0-alpine (không tồn tại)
    container_name: elearning-mongo
    ports:
      - "27017:27017"
    entrypoint:
      - bash
      - -c
      - |
        echo "elearningreplicakey1234567890base64safeA" > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown 999:999 /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: securepassword123
    volumes:
      - mongo-data:/data/db
    networks:
      - elearning-network
    restart: unless-stopped
    healthcheck:
      test: >
        mongosh -u admin -p securepassword123 --authenticationDatabase admin --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); }"
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Cổng API Nginx (Port 8080)
  # Reverse proxy cho tất cả microservices
  # ============================================
  nginx-gateway:
    image: nginx:alpine
    container_name: elearning-nginx-gateway
    ports:
      - "8080:8080"
      - "8443:443"  # HTTPS port (optional)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL certificates (optional)
    depends_on:
      - auth-service
      - user-service
      - course-service
      - order-service
      - payment-service
      - learning-service
      - frontend
    networks:
      - elearning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Frontend Service (For end-users)
  # Port: 3000
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: "${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}"
    container_name: elearning-frontend
    ports:
      - "3000:80"
    networks:
      - elearning-network
    restart: unless-stopped

  # ============================================
  # Admin Frontend Service
  # Port: 4000
  # ============================================
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: elearning-admin-frontend
    ports:
      - "4000:80"
    networks:
      - elearning-network
    restart: unless-stopped

  # ============================================
  # Microservice 1: Authentication Service
  # Port: 3001
  # Database: auth_db
  # ============================================
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: elearning-auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/auth_db?authSource=admin"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_REFRESH_SECRET: "your-super-secret-refresh-token-key-change-in-production"
      JWT_EXPIRES_IN: "1h"
      JWT_REFRESH_EXPIRES_IN: "7d"
      ADMIN_EMAIL: "admin@elearning.local"
      ADMIN_PASSWORD: "Admin123456"
      AUTO_SEED_ADMIN: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elearning-network
    restart: unless-stopped
    # DEPLOY-PRE-01: the container only starts the app. Schema sync (prisma db push) and seeds are manual, separate steps -
    # see docs/database-maintenance.md. Nothing writes to the database at startup.
    command: sh -c "node dist/src/index.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Microservice 2: User Service
  # Port: 3002
  # Database: user_db
  # ============================================
  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: elearning-user-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/user_db?authSource=admin"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      AUTO_SEED: "true"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-internal_secret_token_umi}"
      # Payment -> User credential for /api/users/become-instructor/confirm (FIX 07B-1). No default on purpose:
      # unset = the route refuses every call. Generate a long random value (see services/user-service/.env.example).
      PAYMENT_USER_TOKEN: "${PAYMENT_USER_TOKEN}"
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - elearning-network
    restart: unless-stopped
    # DEPLOY-PRE-01: the container only starts the app. Schema sync (prisma db push) and seeds are manual, separate steps -
    # see docs/database-maintenance.md. Nothing writes to the database at startup.
    command: sh -c "sleep 5 && node dist/src/index.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/users/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Microservice 3: Course Service
  # Port: 3003
  # Database: course_db
  # ============================================
  course-service:
    build:
      context: .
      dockerfile: ./services/course-service/Dockerfile
    container_name: elearning-course-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/course_db?authSource=admin"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      USER_SERVICE_URL: "http://user-service:3002"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_PUBLIC_URL: "http://localhost:9000"
      LEARNING_SERVICE_URL: "http://learning-service:3006"
      # FIX-INS-03, no default on purpose (unset / short / a public default = the protected calls are refused, fail-closed):
      # Course <-> Learning credential, the SAME value as in learning-service: sent to the per-course student-progress routes
      # (FIX-INS-03) AND checked on /api/courses/internal/:id/lessons[/:lessonId] and /recommendations/batch (FIX-INS-06)
      COURSE_LEARNING_TOKEN: "${COURSE_LEARNING_TOKEN}"
      # Order -> Course credential, the SAME value as in order-service (checked on POST /api/courses/:id/increment-enrollment)
      ORDER_COURSE_TOKEN: "${ORDER_COURSE_TOKEN}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elearning-network
    restart: unless-stopped
    # DEPLOY-PRE-01: the container only starts the app. Schema sync (prisma db push) and seeds are manual, separate steps -
    # see docs/database-maintenance.md. Nothing writes to the database at startup.
    command: sh -c "node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/api/courses/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Microservice 4: Order Service
  # Port: 3004
  # Database: order_db
  # ============================================
  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: elearning-order-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/order_db?authSource=admin"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      USER_SERVICE_URL: "http://user-service:3002"
      COURSE_SERVICE_URL: "http://course-service:3003"
      PAYMENT_SERVICE_URL: "http://payment-service:3005"
      LEARNING_SERVICE_URL: "http://learning-service:3006"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-internal_secret_token_umi}"
      # Order <-> Payment credential (FIX 07B-2A), the SAME value in order-service and payment-service. No default on purpose:
      # unset / short / a public default = the service refuses to start. See services/order-service/.env.example.
      ORDER_PAYMENT_TOKEN: "${ORDER_PAYMENT_TOKEN}"
      # Order -> Course credential (FIX-INS-03), the SAME value as in course-service. No default on purpose: without a usable
      # value the enrolledCount increment is not sent (the enrollment itself is unaffected).
      ORDER_COURSE_TOKEN: "${ORDER_COURSE_TOKEN}"
      # Order <-> Learning credential (FIX-INS-04), the SAME value as in learning-service: sent with every paid-course enrollment
      # and checked on the learning-service's entitlement callback. No default on purpose: without it no course is granted.
      ORDER_LEARNING_TOKEN: "${ORDER_LEARNING_TOKEN}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elearning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/api/orders/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Microservice 5: Payment Service
  # Port: 3005
  # Database: payment_db
  # ============================================
  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: elearning-payment-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/payment_db?authSource=admin"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PAYOS_CLIENT_ID: "${PAYOS_CLIENT_ID:-}"
      PAYOS_API_KEY: "${PAYOS_API_KEY:-}"
      PAYOS_CHECKSUM_KEY: "${PAYOS_CHECKSUM_KEY:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-internal_secret_token_umi}"
      # Order <-> Payment credential (FIX 07B-2A), the SAME value in order-service and payment-service. No default on purpose:
      # unset / short / a public default = the service refuses to start. See services/payment-service/.env.example.
      ORDER_PAYMENT_TOKEN: "${ORDER_PAYMENT_TOKEN}"
      # Payment -> User credential (FIX 07B-1); no default: unset = the role upgrade call is not sent.
      PAYMENT_USER_TOKEN: "${PAYMENT_USER_TOKEN}"
      # Demo payment completion: OFF unless exactly "true", and always off when NODE_ENV=production.
      PAYMENT_MOCK_ENABLED: "${PAYMENT_MOCK_ENABLED:-false}"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      USER_SERVICE_URL: "http://user-service:3002"
      ORDER_SERVICE_URL: "http://order-service:3004"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elearning-network
    restart: unless-stopped
    # DEPLOY-PRE-01: the container only starts the app. Schema sync (prisma db push) and seeds are manual, separate steps -
    # see docs/database-maintenance.md. Nothing writes to the database at startup.
    command: sh -c "node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/api/payments/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Microservice 6: Learning Service
  # Port: 3006
  # Database: learning_db
  # ============================================
  learning-service:
    build:
      context: .
      dockerfile: ./services/learning-service/Dockerfile
    container_name: elearning-learning-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/learning_db?authSource=admin"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      USER_SERVICE_URL: "http://user-service:3002"
      COURSE_SERVICE_URL: "http://course-service:3003"
      ORDER_SERVICE_URL: "http://order-service:3004"
      AI_SERVICE_URL: "http://ai-service:3007"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-internal_secret_token_umi}"
      # Course <-> Learning credential (FIX-INS-03/06), the SAME value as in course-service. No default on purpose: unset / short /
      # a public default = GET /api/learning/progress/course/:id/students[/:userId] refuse every call (fail-closed), and this
      # service cannot read lessons / recommendations from the course-service's internal routes (FIX-INS-06).
      COURSE_LEARNING_TOKEN: "${COURSE_LEARNING_TOKEN}"
      # Order <-> Learning credential (FIX-INS-04), the SAME value as in order-service. No default on purpose: unset / short / a
      # public default = POST /api/learning/internal/courses/:id/enroll refuses every call (fail-closed).
      ORDER_LEARNING_TOKEN: "${ORDER_LEARNING_TOKEN}"
      # AI -> Learning credential (FIX-INS-05), the SAME value as in ai-service. No default on purpose: unset / short / a public
      # default = /api/learning/internal/skill-profile/:userId and /internal/learner-analysis/:userId[/invalidate] refuse every call.
      AI_LEARNING_TOKEN: "${AI_LEARNING_TOKEN}"
      # HMAC key of the short-lived learning-path image URLs (FIX-INS-14). The SAME value for every learning-service instance and
      # across restarts. No default on purpose: unset / shorter than 32 characters / equal to a service credential = no image
      # upload (500) and images of non-published paths are not displayed (published ones still are); the reason is logged.
      PATH_IMAGE_SIGNING_SECRET: "${PATH_IMAGE_SIGNING_SECRET}"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_PUBLIC_URL: "http://localhost:9000"
      MINIO_VIDEO_BUCKET: "course-videos"
      PRESIGNED_URL_EXPIRY: "60"
      HLS_TEMP_DIR: "/tmp/hls-processing"
      VIDEO_UPLOAD_DIR: "/tmp/video-uploads"
      MAX_VIDEO_SIZE_MB: "2048"
      # Blockchain Certificate Verification
      BLOCKCHAIN_ENABLED: "${BLOCKCHAIN_ENABLED:-false}"
      BLOCKCHAIN_NETWORK: "polygon-amoy"
      BLOCKCHAIN_CHAIN_ID: "80002"
      BLOCKCHAIN_RPC_URL: "${BLOCKCHAIN_RPC_URL:-}"
      BLOCKCHAIN_PRIVATE_KEY: "${BLOCKCHAIN_PRIVATE_KEY:-}"
      BLOCKCHAIN_CONTRACT_ADDRESS: "${BLOCKCHAIN_CONTRACT_ADDRESS:-}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elearning-network
    restart: unless-stopped
    # DEPLOY-PRE-01: the container only starts the app. Schema sync (prisma db push) and seeds are manual, separate steps -
    # see docs/database-maintenance.md. Nothing writes to the database at startup.
    # (The learning-path demo seed used to run here behind a check that seeded on a failed query and wiped every path + final
    # project; it is now manual and empty-database-only, see prisma/seed-paths.ts.)
    command: sh -c "node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/api/learning/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Microservice 7: AI Service
  # Port: 3007
  # Database: ai_db
  # ============================================
  ai-service:
    build:
      context: .
      dockerfile: ./services/ai-service/Dockerfile
    container_name: elearning-ai-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      NODE_ENV: development
      DATABASE_URL: "mongodb://admin:securepassword123@mongodb:27017/ai_db?authSource=admin"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5173"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "gemini-3.1-flash-lite"
      MAX_CONTEXT_MESSAGES: "20"
      LEARNING_SERVICE_URL: "http://learning-service:3006"
      COURSE_SERVICE_URL: "http://course-service:3003"
      USER_SERVICE_URL: "http://user-service:3002"
      # AI -> Learning credential (FIX-INS-05), the SAME value as in learning-service: sent to the learning-service's internal
      # skill-profile / learner-analysis routes. No default on purpose: without it those calls are not sent (the AI degrades to null).
      AI_LEARNING_TOKEN: "${AI_LEARNING_TOKEN}"
      # RAG Foundation
      EMBEDDING_PROVIDER: "gemini"
      EMBEDDING_MODEL: "gemini-embedding-001"
      EMBEDDING_DIMENSION: "768"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "umi_knowledge"
      CHUNK_SIZE: "600"
      CHUNK_OVERLAP: "100"
      RETRIEVAL_TOP_K: "5"
      # RAG-P0: RelevanceGate threshold (cosine). 0.56 = the validated gap between relevant and out-of-knowledge queries
      # (RAG evaluation baseline-v1). 0.0 disabled the gate: every query got top-K chunks and an answer "from the course".
      RETRIEVAL_SCORE_THRESHOLD: "0.56"
      MAX_CONTEXT_TOKENS: "4000"
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_started
      qdrant:
        condition: service_healthy
    networks:
      - elearning-network
    restart: unless-stopped
    # DEPLOY-PRE-01: the container only starts the app. Schema sync (prisma db push) and seeds are manual, separate steps -
    # see docs/database-maintenance.md. Nothing writes to the database at startup.
    command: sh -c "node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/api/ai/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Qdrant Vector Database — RAG Foundation
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: elearning-qdrant
    ports:
      - "6333:6333"    # REST API + Dashboard
      - "6334:6334"    # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - elearning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # MinIO File Storage Service
  # ============================================
  minio:
    image: elestio/minio:latest
    container_name: elearning-minio
    ports:
      - "9000:9000"   # S3 API port
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: assignments,quiz-attachments,courses
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - elearning-network
    restart: unless-stopped

  # ============================================
  # MinIO Client - Initialize buckets
  # ============================================
  minio-init:
    image: elestio/minio:latest
    container_name: elearning-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/assignments --ignore-existing;
      mc mb myminio/quiz-attachments --ignore-existing;
      mc mb myminio/courses --ignore-existing;
      mc mb myminio/course-videos --ignore-existing;
      echo 'MinIO buckets initialized and set to PRIVATE';
      exit 0;
      "
    networks:
      - elearning-network

# ============================================
# Networks
# ============================================
networks:
  elearning-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  mongo-data:
    driver: local
  minio-data:
    driver: local
  qdrant-data:
    driver: local
